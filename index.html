  var stage = document.getElementById('stage');
  var box = document.getElementById('box');
  var label = document.getElementById('facelabel');
  var u = 1, zoom = 0.88;
  var faces = {};
  function makeFace(name, wmm, hmm, transform, img) {
    var el = document.createElement('div');
    el.className = 'face';
    el.style.backgroundImage = 'url(' + img + ')';
    el.dataset.w = wmm; el.dataset.h = hmm; el.dataset.t = transform;
    box.appendChild(el);
    faces[name] = el;
  }
  makeFace('top',    340, 340, 'rotateX(90deg) translateZ(56mm)', TEX.TOP);
  makeFace('bottom', 340, 340, 'rotateX(-90deg) translateZ(56mm)', TEX.BOTTOM);
  makeFace('front',  340, 112, 'translateZ(170mm)', TEX.FRONT);
  makeFace('back',   340, 112, 'rotateY(180deg) translateZ(170mm)', TEX.BACK);
  makeFace('right',  340, 112, 'rotateY(90deg) translateZ(170mm)', TEX.RIGHT);
  makeFace('left',   340, 112, 'rotateY(-90deg) translateZ(170mm)', TEX.LEFT);
  function layout() {
    var w = stage.clientWidth, h = stage.clientHeight;
    u = Math.min(w / 470, h / 410, 1.55);
    if (u < 0.4) u = 0.4;
    Object.keys(faces).forEach(function(k) {
      var el = faces[k];
      var W = (+el.dataset.w) * u, H = (+el.dataset.h) * u;
      el.style.width = W + 'px'; el.style.height = H + 'px';
      el.style.marginLeft = (-W / 2) + 'px'; el.style.marginTop = (-H / 2) + 'px';
      el.style.transform = el.dataset.t.replace(/(-?[\d.]+)mm/g, function(m, v) { return (parseFloat(v) * u) + 'px'; });
    });
  }
  var rx = -20, ry = -28, auto = true, dragging = false, px = 0, py = 0, vx = 0, vy = 0;
  function currentFace() {
    if (rx <= -52) return '盖 面';
    if (rx >= 52) return '箱 底';
    var a = ((ry % 360) + 360) % 360;
    if (a < 45 || a >= 315) return '正 面';
    if (a < 135) return '左 侧 · 分 级';
    if (a < 225) return '背 面';
    return '右 侧 · 卖 点';
  }
  function apply() {
    box.style.transform = 'scale(' + zoom + ') rotateX(' + rx + 'deg) rotateY(' + ry + 'deg)';
    box.style.webkitTransform = box.style.transform;
    label.textContent = currentFace();
  }
  function tick() {
    if (auto && !dragging) { ry += 0.45; apply(); }
    else if (!dragging && (Math.abs(vx) > 0.02 || Math.abs(vy) > 0.02)) {
      ry += vx; rx -= vy; rx = Math.max(-88, Math.min(88, rx));
      vx *= 0.94; vy *= 0.94; apply();

  stage.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    var dx = e.clientX - px, dy = e.clientY - py;
    px = e.clientX; py = e.clientY;

    rx = Math.max(-88, Math.min(88, rx));
    vx = dx * 0.45; vy = dy * 0.45;
    apply();
  });
  function endDrag() { dragging = false; }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);
  var views = { top: [-88, 0], front: [0, 0], right: [0, 270], back: [0, 180], left: [0, 90], bottom: [88, 0] };
  document.querySelectorAll('[data-view]').forEach(function(b) {
    b.addEventListener('click', function() {
      var v = views[b.dataset.view];
      rx = v[0]; ry = v[1]; vx = 0; vy = 0; apply();
    });
  });
  var ab = document.getElementById('autorot');
  ab.addEventListener('click', function() {
    auto = !auto;
    ab.textContent = '自动旋转：' + (auto ? '开' : '关');
    ab.classList.toggle('on', auto);
  });
  document.getElementById('reset').addEventListener('click', function() {
    rx = -20; ry = -28; vx = 0; vy = 0; zoom = 0.88;
    document.getElementById('zoom').value = 88;
    apply();
  });
  document.getElementById('zoom').addEventListener('input', function(e) {
    zoom = e.target.value / 100; apply();
  });
